<!doctype html><meta charset="utf-8"><title>compare</title>
<iframe id="a" style="width:960px;height:540px;border:0"></iframe><iframe id="b" style="width:960px;height:540px;border:0"></iframe>
<script type="module">
// Runs in a headless Chrome started by versions.mjs: draws two versions at the same moment and reports what differs.
// Both are compared at the same second of the voice, so a re-paced voice doesn't read as everything after it having changed.
const FPS = 30, TW = 240, TH = 135, BLOCK = 5, GW = TW / BLOCK | 0, GH = TH / BLOCK | 0;
const LIMIT = 1; // brightness levels of 255 in one block: same film gave exactly 0, a camera moved 3cm gave over 30
const WHOLE = 0.5; // past this share of the picture, it's the camera or the light, and a box around everything says nothing
const MAX_BOXES = 6, BATCH = 20;
const [, , a, b] = location.pathname.split("/");
const post = (step, data) => fetch(`/compare-job/${a}/${b}/${step}`, { method: "POST", body: JSON.stringify(data) });

const load = (id, version) => new Promise((ok, no) => {
  const frame = document.getElementById(id);
  const on = (e) => {
    if (e.source !== frame.contentWindow) return;
    removeEventListener("message", on);
    if (e.data.filmError) no(new Error(e.data.filmError)); else ok(frame.contentWindow.__film);
  };
  addEventListener("message", on);
  frame.src = `/before/${version}/?job=1`;
});
const thumb = document.createElement("canvas"); thumb.width = TW; thumb.height = TH;
const tc = thumb.getContext("2d", { willReadFrequently: true });
const grid = (film, t) => {
  film.draw(t);
  tc.drawImage(film.canvas, 0, 0, TW, TH);
  const d = tc.getImageData(0, 0, TW, TH).data, g = new Float32Array(GW * GH);
  for (let y = 0; y < GH * BLOCK; y++) for (let x = 0; x < GW * BLOCK; x++) { const i = (y * TW + x) * 4; g[(y / BLOCK | 0) * GW + (x / BLOCK | 0)] += (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) / 256 / (BLOCK * BLOCK); }
  return g;
};
// Separate things get separate boxes; blocks one apart count as the same thing
const boxesOf = (on) => {
  const seen = new Uint8Array(on.length), boxes = [];
  for (let s = 0; s < on.length; s++) {
    if (!on[s] || seen[s]) continue;
    let x0 = GW, y0 = GH, x1 = -1, y1 = -1;
    const stack = [s];
    seen[s] = 1;
    while (stack.length) {
      const c = stack.pop(), x = c % GW, y = c / GW | 0;
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
        const n = ny * GW + nx;
        if (on[n] && !seen[n]) { seen[n] = 1; stack.push(n); }
      }
    }
    boxes.push([x0, y0, x1 + 1, y1 + 1]);
  }
  if (boxes.length > MAX_BOXES) return [[Math.min(...boxes.map((q) => q[0])), Math.min(...boxes.map((q) => q[1])), Math.max(...boxes.map((q) => q[2])), Math.max(...boxes.map((q) => q[3]))]];
  return boxes;
};
const compare = (A, B, f) => {
  const t = f / FPS;
  const ga = grid(A, A.fromSource(B.toSource(t))), gb = grid(B, t);
  const on = new Uint8Array(ga.length);
  let n = 0;
  for (let i = 0; i < ga.length; i++) if (Math.abs(ga[i] - gb[i]) > LIMIT) { on[i] = 1; n++; }
  if (!n) return { f };
  const whole = n / on.length > WHOLE;
  return { f, n, w: whole ? 1 : undefined, b: whole ? undefined : boxesOf(on).map((q) => [+(q[0] / GW).toFixed(3), +(q[1] / GH).toFixed(3), +(q[2] / GW).toFixed(3), +(q[3] / GH).toFixed(3)]) };
};

try {
  const [A, B] = await Promise.all([load("a", a), load("b", b)]);
  const last = Math.floor(B.duration * FPS) - 1;
  const already = new Set(await (await fetch(`/compare-job/${a}/${b}/done`)).json());
  // A rough pass finds everything worth seeing in seconds; the finer one sharpens its edges and catches shorter changes
  const order = [];
  for (let f = 0; f <= last; f += 15) order.push(f);
  for (let f = 0; f <= last; f += 5) if (f % 15) order.push(f);
  await post("start", { total: order.length });
  let rows = [];
  for (const f of order) {
    if (already.has(f)) continue;
    rows.push(compare(A, B, f));
    if (rows.length >= BATCH) { await post("rows", rows); rows = []; }
  }
  if (rows.length) await post("rows", rows);
  await post("finish", {});
} catch (e) {
  // Failing to report means the studio is gone: leave no Chrome behind
  await post("fail", { message: e?.stack ?? String(e) }).catch(() => {});
  window.close();
}
</script>
